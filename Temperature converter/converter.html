<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-wrapper">
        <h2>Temperature Converter</h2>
        <p class="subtitle">Enter the temperature, select units and submit</p>

        <div class="converter-row">
            <input type="number" id="temp-input" placeholder="0.00">
            
            <select id="from-unit">
                <option value="" disabled selected>From Unit</option>
                <option value="Celsius">Celsius</option>
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Kelvin">Kelvin</option>
            </select>

            <select id="to-unit">
                <option value="" disabled selected>To Unit</option>
                <option value="Celsius">Celsius</option>
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Kelvin">Kelvin</option>
            </select>

            <button id="convert-btn" disabled>Convert</button>
        </div>

        <div id="result-box" class="result-text" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
